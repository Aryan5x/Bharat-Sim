version: "3.8"

services:
  bharatsim-worker:
    build:
      context: ../..
      dockerfile: deploy/worker/Dockerfile.kvm
    container_name: bharatsim-worker-node
    restart: unless-stopped
    devices:
      - /dev/kvm:/dev/kvm
    environment:
      - BHARATSIM_API_URL=https://bharat-sim-81g2.vercel.app
      - BHARATSIM_WORKER_TOKEN=${BHARATSIM_WORKER_TOKEN}
      - BHARATSIM_WORKER_ID=docker-kvm-worker-01
      - ANDROID_SERIAL=emulator-5554
      - BHARATSIM_ENABLE_LOCAL_APK_EXECUTION=true
      - BHARATSIM_POLL_SECONDS=5
      - BHARATSIM_SMOKE_DURATION_SECONDS=20
    volumes:
      - /tmp/bharatsim-artifacts:/opt/bharatsim/artifacts
    cap_add:
      - NET_ADMIN
